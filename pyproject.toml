[project]
name = "llm-code-review-agent"
version = "0.1.0"
description = "AI agent that reviews code for bugs and security vulnerabilities across 5 languages, with RAG-grounded findings, suggested fixes, and plain-English explanations."
authors = [
    { name = "Murali Krishna Pole", email = "krishnapole90@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.109.1",
    "chromadb>=1.5.9",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "langchain>=1.3.9",
    "langchain-anthropic>=1.4.6",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.5",
    "langsmith>=0.8.15",
    "mlflow>=3.13.0",
    "pandas>=2.3.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sentence-transformers>=5.5.1",
    "streamlit>=1.58.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn[standard]>=0.49.0",
]

[project.urls]
Homepage = "https://github.com/Kpole95/llm-code-review-agent"
Repository = "https://github.com/Kpole95/llm-code-review-agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]

[tool.ruff]
exclude = [
    "src/eval/test_set/snippets",
    "src/eval/holdout/snippets",
    "tests/fixtures",
]
